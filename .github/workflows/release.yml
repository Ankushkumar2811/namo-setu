name: Build and Deploy API
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options: [staging, production]
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  image:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/ankushkumar2811/namo-setu-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    runs-on: ubuntu-latest
    needs: image
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0
      - name: Configure cluster
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          install -d -m 700 "$HOME/.kube"
          printf '%s' "$KUBECONFIG_B64" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Deploy immutable image
        run: |
          kubectl -n namo-setu set image deployment/api api=ghcr.io/ankushkumar2811/namo-setu-api@${{ needs.image.outputs.digest }}
          kubectl -n namo-setu rollout status deployment/api --timeout=10m
      - name: Verify health
        run: kubectl -n namo-setu wait --for=condition=available deployment/api --timeout=2m
