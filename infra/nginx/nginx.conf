user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections 4096; multi_accept on; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time}';
  access_log /var/log/nginx/access.log json;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  gzip on;
  gzip_vary on;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;
  limit_req_zone $binary_remote_addr zone=api:20m rate=20r/s;
  upstream api {
    least_conn;
    server api:8000 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }
  server {
    listen 8080;
    client_max_body_size 10m;
    location = /health { proxy_pass http://api; access_log off; }
    location / {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 3s;
      proxy_read_timeout 60s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }
  }
}
