apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  selector: {app: {{ .Release.Name }}-api}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
