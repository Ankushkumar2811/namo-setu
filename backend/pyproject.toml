[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "namo-setu-api"
version = "1.0.0"
description = "Production API for the NAMO SETU pilgrimage ecosystem"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "gunicorn>=23,<24",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "pyjwt[crypto]>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "redis>=6.2,<7",
  "httpx>=0.28,<1",
  "email-validator>=2.2,<3",
  "structlog>=25.4,<26",
  "prometheus-client>=0.22,<1",
  "openai>=1.97,<2"
]

[project.optional-dependencies]
test = ["pytest>=8.4,<9", "pytest-asyncio>=1.0,<2", "aiosqlite>=0.21,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
